name: Versionen abfragen (temporär)
on:
  push:
    branches: [hardening]
    paths: [.github/workflows/versions.yml]
jobs:
  v:
    runs-on: ubuntu-latest
    steps:
      - run: |
          q() { echo "$1: $(curl -s "$2/maven-metadata.xml" | grep -o '<version>[^<]*</version>' | sed 's/<[^>]*>//g' | grep -viE 'alpha|beta|rc|dev|-M[0-9]|eap|snapshot' | tail -5 | tr '\n' ' ')"; }
          G=https://dl.google.com/dl/android/maven2
          C=https://repo1.maven.org/maven2
          q agp $G/com/android/tools/build/gradle
          q kotlin $C/org/jetbrains/kotlin/kotlin-gradle-plugin
          q ksp $C/com/google/devtools/ksp/com.google.devtools.ksp.gradle.plugin
          q bom $G/androidx/compose/compose-bom
          q room $G/androidx/room/room-runtime
          q core $G/androidx/core/core-ktx
          q splash $G/androidx/core/core-splashscreen
          q activity $G/androidx/activity/activity-compose
          q lifecycle $G/androidx/lifecycle/lifecycle-runtime-compose
          q navigation $G/androidx/navigation/navigation-compose
          q exif $G/androidx/exifinterface/exifinterface
          q work $G/androidx/work/work-runtime-ktx
          q profileinstaller $G/androidx/profileinstaller/profileinstaller
          q okhttp $C/com/squareup/okhttp3/okhttp
          q serialization $C/org/jetbrains/kotlinx/kotlinx-serialization-json
          q coil $C/io/coil-kt/coil-compose
          q osmdroid $C/org/osmdroid/osmdroid-android
          q robolectric $C/org/robolectric/robolectric
          q testcore $G/androidx/test/core
          q gradle-x https://services.gradle.org/versions/all
          curl -s https://services.gradle.org/versions/current | grep '"version"'
