name: Versionen abfragen (temporär)
on:
  push:
    branches: [next]
    paths: [.github/workflows/versions.yml]
jobs:
  v:
    runs-on: ubuntu-latest
    steps:
      - run: |
          q() { echo "$1: $(curl -s "$2/maven-metadata.xml" | grep -o '<version>[^<]*</version>' | sed 's/<[^>]*>//g' | grep -viE 'alpha|beta|rc|dev|snapshot' | tail -4 | tr '\n' ' ')"; }
          G=https://dl.google.com/dl/android/maven2
          q baselineprofile-plugin $G/androidx/baselineprofile/androidx.baselineprofile.gradle.plugin
          q benchmark-macro $G/androidx/benchmark/benchmark-macro-junit4
          q uiautomator $G/androidx/test/uiautomator/uiautomator
          q test-ext-junit $G/androidx/test/ext/junit
          q test-runner $G/androidx/test/runner
          q emulator-runner-note https://repo1.maven.org/maven2/junit/junit
          sdkmanager --list 2>/dev/null | grep -E "system-images;android-3[4-7];(google_apis|default|aosp_atd|google_atd);x86_64" | head -20 || true
          ls $ANDROID_HOME/system-images 2>/dev/null || true
